<title>Black Hole Gacha Test</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: grid;
    place-items: center;
    perspective: 1000px;
    background: radial-gradient(circle at 50% 50%, #211132 0%, #0b0710 28%, #020204 68%, #000 100%);
}

.stars {
    position: absolute;
    inset: 0;
    opacity: 0.42;
    background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 0 1px, transparent 1.3px),
        radial-gradient(circle, rgba(198,160,255,0.55) 0 1px, transparent 1.3px);
    background-size: 91px 91px, 151px 151px;
    background-position: 12px 19px, 61px 77px;
}

.black-hole {
    position: absolute;
    width: 360px;
    height: 360px;
    z-index: 40;
    border-radius: 50%;
    transform-style: preserve-3d;
}

.core {
    position: absolute;
    inset: 25%;
    border-radius: 50%;
    background: radial-gradient(circle, #000 0 57%, #020105 67%, rgba(35, 6, 53, 0.82) 78%, transparent 100%);
    box-shadow: 0 0 20px #000, 0 0 55px rgba(99, 38, 166, 0.46), 0 0 120px rgba(84, 26, 154, 0.28);
}

.ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--diameter);
    height: var(--diameter);
    border-radius: 50%;
    border: var(--thickness) solid transparent;
    transform-origin: center center;
    transform: translate(-50%, -50%) rotateX(var(--tilt)) rotateZ(0deg);
    transform-style: preserve-3d;
    mix-blend-mode: screen;
    pointer-events: none;
}

.ring-1 {
    --diameter: 350px;
    --thickness: 4px;
    --tilt: 69deg;
    border-top-color: rgba(208, 157, 255, 0.95);
    border-right-color: rgba(131, 57, 231, 0.92);
    border-bottom-color: rgba(94, 34, 184, 0.62);
    filter: drop-shadow(0 0 8px rgba(168, 88, 255, 0.95));
    animation: ringRotate1 1900ms linear infinite;
}

.ring-2 {
    --diameter: 305px;
    --thickness: 3px;
    --tilt: 64deg;
    border-left-color: rgba(255, 255, 255, 0.92);
    border-top-color: rgba(174, 107, 255, 0.92);
    border-bottom-color: rgba(86, 34, 174, 0.60);
    filter: drop-shadow(0 0 12px rgba(198, 143, 255, 0.95));
    animation: ringRotate2 1250ms linear infinite reverse;
}

.ring-3 {
    --diameter: 255px;
    --thickness: 5px;
    --tilt: 58deg;
    border-right-color: rgba(255, 255, 255, 0.78);
    border-left-color: rgba(126, 54, 228, 0.95);
    filter: blur(1px) drop-shadow(0 0 14px rgba(140, 74, 255, 0.94));
    animation: ringRotate3 820ms linear infinite;
}

.ring-4 {
    --diameter: 212px;
    --thickness: 3px;
    --tilt: 52deg;
    border-top-color: rgba(255, 255, 255, 0.85);
    border-bottom-color: rgba(131, 57, 239, 0.90);
    filter: drop-shadow(0 0 10px rgba(172, 107, 255, 0.85));
    animation: ringRotate4 630ms linear infinite reverse;
}

@keyframes ringRotate1 {
    from { transform: translate(-50%, -50%) rotateX(69deg) rotateZ(0deg); }
    to { transform: translate(-50%, -50%) rotateX(69deg) rotateZ(360deg); }
}

@keyframes ringRotate2 {
    from { transform: translate(-50%, -50%) rotateX(64deg) rotateZ(360deg); }
    to { transform: translate(-50%, -50%) rotateX(64deg) rotateZ(0deg); }
}

@keyframes ringRotate3 {
    from { transform: translate(-50%, -50%) rotateX(58deg) rotateZ(0deg); }
    to { transform: translate(-50%, -50%) rotateX(58deg) rotateZ(360deg); }
}

@keyframes ringRotate4 {
    from { transform: translate(-50%, -50%) rotateX(52deg) rotateZ(360deg); }
    to { transform: translate(-50%, -50%) rotateX(52deg) rotateZ(0deg); }
}

.controls {
    position: absolute;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    z-index: 200;
    display: flex;
    gap: 16px;
}

.btn {
    padding: 12px 24px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}

.btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.4);
}

.btn.primary {
    background: rgba(168, 88, 255, 0.3);
    border-color: rgba(168, 88, 255, 0.5);
}

.btn.primary:hover {
    background: rgba(168, 88, 255, 0.5);
}
</style>

<div class="scene">
    <div class="stars"></div>

    <div class="black-hole" id="blackHole">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="ring ring-4"></div>
        <div class="core"></div>
    </div>

    <div class="controls" id="controls">
        <button class="btn" id="fadeBtn">Fade Controls</button>
        <button class="btn" id="restoreBtn">Restore Controls</button>
        <button class="btn primary" id="testBtn">Test Sequence</button>
    </div>
</div>

<script>
const controls = document.getElementById('controls');
const fadeBtn = document.getElementById('fadeBtn');
const restoreBtn = document.getElementById('restoreBtn');
const testBtn = document.getElementById('testBtn');

fadeBtn.addEventListener('click', () => {
    console.log('[TEST] Fading controls...');
    controls.style.transition = 'opacity 0.4s ease-out';
    controls.style.opacity = '0';
    controls.style.pointerEvents = 'none';
    console.log('[TEST] Controls faded. Inline styles:', controls.style.cssText);
});

restoreBtn.addEventListener('click', () => {
    console.log('[TEST] Restoring controls...');
    controls.style.opacity = '1';
    controls.style.pointerEvents = 'auto';
    console.log('[TEST] Controls restored. Inline styles:', controls.style.cssText);
});

testBtn.addEventListener('click', async () => {
    console.log('[TEST] Starting test sequence...');

    // 1. Fade controls
    console.log('[TEST] Step 1: Fade');
    controls.style.transition = 'opacity 0.4s ease-out';
    controls.style.opacity = '0';
    controls.style.pointerEvents = 'none';

    await new Promise(r => setTimeout(r, 2000));

    // 2. Try to restore
    console.log('[TEST] Step 2: Restore');
    controls.style.opacity = '1';
    controls.style.pointerEvents = 'auto';
    console.log('[TEST] After restore, inline styles:', controls.style.cssText);
    console.log('[TEST] After restore, computed opacity:', getComputedStyle(controls).opacity);
    console.log('[TEST] After restore, computed pointerEvents:', getComputedStyle(controls).pointerEvents);
});
</script>
